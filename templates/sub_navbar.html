{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subnavbar</title>
    <link rel="stylesheet" href="{% static "css/sub_navbar.css" %}">
</head>
<body>
    <div class = "sidebar">
        <div class = "sidebar_content">
            <div class = "profile_section">
                <i class = "fa-regular fa-user"></i>
                <h3>Hello, Sign In</h3>
            </div>
            <div class = "trending">
                {% for items in data %}
                    <h4>{{items.title}}</h4>
                    {% for product_item in items.items %}
                        <p>{{product_item.name}}</p>
                    {% endfor %}
                    <hr>
                {% endfor %}
            </div>
        </div>
        <div class = "crossbar" onclick = "HideSidebar()">
            <i class="fa-solid fa-xmark"></i>
        </div>
    </div>
</body>
</html>
